<ion-header class="modal-header">
  <ion-toolbar>
    <ion-title>Edit Report</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [forceOverscroll]="false" class="modal-content">

  <!-- Category -->
  <ion-item>
    <ion-label position="stacked">Category</ion-label>
    <ion-select
      [(ngModel)]="editData.category"
      interface="popover"
      (ionChange)="onCategoryChange()"
      placeholder="Select Category"
    >
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Other Category -->
  <ion-item *ngIf="showOtherCategory">
    <ion-label position="stacked">Specify Category</ion-label>
    <ion-input
      [(ngModel)]="editData.otherCategory"
      placeholder="Enter category"
    ></ion-input>
  </ion-item>

  <!-- Barangay -->
  <ion-item>
    <ion-label position="stacked">Barangay</ion-label>
    <ion-select
      [(ngModel)]="editData.barangay"
      interface="popover"
      placeholder="Select Barangay"
    >
      <ion-select-option *ngFor="let b of barangays" [value]="b">
        {{ b }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Landmark -->
  <ion-item>
    <ion-label position="stacked">Landmark</ion-label>
    <ion-input
      [(ngModel)]="editData.landmark"
      placeholder="Enter landmark"
    ></ion-input>
  </ion-item>

  <!-- Description -->
  <ion-item>
    <ion-label position="stacked">Description</ion-label>
    <ion-input
      [(ngModel)]="editData.description"
      placeholder="Enter description"
    ></ion-input>
  </ion-item>

  <!-- Buttons -->
  <div class="modal-buttons">
    <ion-button class="save-btn" (click)="saveEdit()">Save</ion-button>
    <ion-button class="cancel-btn" (click)="goBack()">Cancel</ion-button>
  </div>

</ion-content>
