<ion-content [fullscreen]="true" class="reports-content">
  <!-- Header -->
  <div class="header">
    <ion-button fill="clear" class="back-button" (click)="goBack()">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button>

    <h1>Incident Reports</h1>

    <ion-button fill="clear" class="add-button" (click)="addReport()">
      <ion-icon slot="icon-only" name="add-outline"></ion-icon>
    </ion-button>
  </div>

  <!-- Filter by Category -->
  <ion-item class="filter-item">
    <ion-label position="stacked">Filter by Category</ion-label>
    <ion-select [(ngModel)]="selectedCategory" placeholder="Select Category" interface="popover">
      <ion-select-option value="all">All</ion-select-option>
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Sort by Date/Time -->
  <ion-item class="filter-item">
    <ion-label position="stacked">Sort by Date & Time</ion-label>
    <ion-select [(ngModel)]="selectedSort" placeholder="Select Order" interface="popover">
      <ion-select-option value="desc">Newest First</ion-select-option>
      <ion-select-option value="asc">Oldest First</ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Loading Spinner -->
  <div class="loading" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading reports...</p>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!loading && filteredAndSortedReports.length === 0">
    <ion-icon name="document-text-outline" class="empty-icon"></ion-icon>
    <p>No incident reports yet</p>
  </div>

  <!-- Reports List -->
  <div class="reports-list" *ngIf="!loading && filteredAndSortedReports.length > 0">
    <div
      class="report-box"
      *ngFor="let report of filteredAndSortedReports"
      (click)="viewReport(report.id)"
    >
      <ion-icon name="document-text-outline" class="report-icon"></ion-icon>

      <div class="report-info">
        <h2 class="category">{{ report.category }}</h2>
        <p class="date">
          {{ report.datetime | date: 'mediumDate' }} | {{ report.datetime | date: 'shortTime' }}
        </p>
      </div>

      <ion-icon name="chevron-forward-outline" class="arrow-icon"></ion-icon>
    </div>
  </div>

  <app-bottom-nav></app-bottom-nav>
</ion-content>
